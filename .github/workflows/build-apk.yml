name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Fix missing Cordova variables and settings
      run: |
        mkdir -p android/capacitor-cordova-android-plugins
        if [ ! -f android/capacitor-cordova-android-plugins/cordova.variables.gradle ]; then
          echo "ext {" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          echo "    minSdkVersion = 22" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
          echo "    targetSdkVersion = 34" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
          echo "    compileSdkVersion = 34" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
          echo "}" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
        fi
        
        # Pastikan modul terdaftar di settings.gradle jika belum ada
        if ! grep -q "capacitor-cordova-android-plugins" android/settings.gradle; then
          echo "include(':capacitor-cordova-android-plugins')" >> android/settings.gradle
          echo "project(':capacitor-cordova-android-plugins').projectDir = new File('../capacitor-cordova-android-plugins')" >> android/settings.gradle
        fi

    - name: Grant execute permission for gradlew
      run: |
        cd android
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 8.13

    - name: Clean and Build Debug APK with Gradle
      run: |
        cd android
        ./gradlew clean assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
