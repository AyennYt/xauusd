name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Ultimate Cordova & Gradle Fixer
      run: |
        # 1. Buat folder dan isi file variabel yang wajib ada
        mkdir -p android/capacitor-cordova-android-plugins
        echo "ext {" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo "    minSdkVersion = 22" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo "    targetSdkVersion = 34" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo "    compileSdkVersion = 34" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo "}" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle

        # 2. Bersihkan baris dependensi plugin dari app/build.gradle jika masih ada
        python3 -c '
        path = "android/app/build.gradle"
        try:
            with open(path, "r") as f:
                lines = f.readlines()
            with open(path, "w") as f:
                for line in lines:
                    if "capacitor-cordova-android-plugins" not in line:
                        f.write(line)
        except FileNotFoundError:
            pass
        '

    - name: Grant execute permission for gradlew
      run: |
        cd android
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 8.13

    - name: Clean and Build Debug APK with Gradle
      run: |
        cd android
        ./gradlew clean assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
