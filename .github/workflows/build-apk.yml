name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Clean up unused Cordova plugin dependency
      run: |
        # Hapus baris include capacitor-cordova-android-plugins jika ada di settings.gradle
        if [ -f android/settings.gradle ]; then
          sed -i '/capacitor-cordova-android-plugins/d' android/settings.gradle
        fi

    - name: Grant execute permission for gradlew
      run: |
        cd android
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 8.13

    - name: Clean and Build Debug APK with Gradle
      run: |
        cd android
        ./gradlew clean assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
