name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Nuclear Fix - Rewrite settings.gradle clean
      run: |
        # Buat folder variabel yang dibutuhkan capacitor
        mkdir -p android/capacitor-cordova-android-plugins
        echo "ext {" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo "    minSdkVersion = 22" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo "    targetSdkVersion = 34" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo "    compileSdkVersion = 34" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo "}" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle

        # Timpa total settings.gradle agar bersih dari modul cordova yang error
        echo "include ':app'" > android/settings.gradle
        echo "include(':capacitor-android')" >> android/settings.gradle
        echo "project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')" >> android/settings.gradle

        # Hapus baris dependensi plugin dari app/build.gradle jika ada
        python3 -c '
        path = "android/app/build.gradle"
        try:
            with open(path, "r") as f:
                content = f.read()
            import re
            content = re.sub(r".*capacitor-cordova-android-plugins.*", "", content)
            content = re.sub(r"flatDir\s*\{[^}]*\}", "", content)
            with open(path, "w") as f:
                f.write(content)
        except Exception:
            pass
        '

    - name: Install Node and Sync Capacitor config
      run: |
        npm install
        npx cap sync android
        
    - name: Allow HTTP Cleartext Traffic in Android Manifest
      run: |
        python3 -c '
        path = "android/app/src/main/AndroidManifest.xml"
        with open(path, "r") as f:
            content = f.read()
        if "usesCleartextTraffic" not in content:
            content = content.replace("<application", "<application android:usesCleartextTraffic=\"true\"")
            with open(path, "w") as f:
                f.write(content)
        '

        
    - name: Grant execute permission for gradlew
      run: |
        cd android
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 8.13

    - name: Clean and Build Debug APK with Gradle
      run: |
        cd android
        ./gradlew clean assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
