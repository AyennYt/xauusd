name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Fix Cordova variables & Clean flatDir issues
      run: |
        mkdir -p android/capacitor-cordova-android-plugins
        echo "ext {" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo "    minSdkVersion = 22" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo "    targetSdkVersion = 34" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo "    compileSdkVersion = 34" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo "}" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle

        # Buat folder libs agar flatDir tidak error jika dicari
        mkdir -p android/app/libs

        # Komentari atau hapus baris flatDir yang bermasalah di build.gradle jika ada
        if [ -f android/app/build.gradle ]; then
          sed -i 's/flatDir/#flatDir/g' android/app/build.gradle
        fi
        if [ -f android/build.gradle ]; then
          sed -i 's/flatDir/#flatDir/g' android/build.gradle
        fi

    - name: Grant execute permission for gradlew
      run: |
        cd android
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 8.13

    - name: Clean and Build Debug APK with Gradle
      run: |
        cd android
        ./gradlew clean assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
