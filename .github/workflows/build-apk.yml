name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Ensure Cordova variables and patch capacitor build script
      run: |
        # 1. Buat folder dan file cordova.variables.gradle yang dicari
        mkdir -p android/capacitor-cordova-android-plugins
        echo "ext {" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo "    minSdkVersion = 22" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo "    targetSdkVersion = 34" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo "    compileSdkVersion = 34" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo "}" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle

        # 2. Tambahkan pengaman di capacitor.build.gradle agar tidak error jika file variabel dipanggil
        python3 -c '
        path = "android/capacitor.build.gradle"
        try:
            with open(path, "r") as f:
                content = f.read()
            # Ubah cara load file agar tidak crash jika posisinya berubah
            content = content.replace("apply from: \"capacitor-cordova-android-plugins/cordova.variables.gradle\"", "try { apply from: \"capacitor-cordova-android-plugins/cordova.variables.gradle\" } catch (Exception e) {}")
            with open(path, "w") as f:
                f.write(content)
        except FileNotFoundError:
            pass
        '

    - name: Grant execute permission for gradlew
      run: |
        cd android
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 8.13

    - name: Clean and Build Debug APK with Gradle
      run: |
        cd android
        ./gradlew clean assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
