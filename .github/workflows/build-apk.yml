name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Deep Clean flatDir and Fix Cordova variables
     # eslint-disable-next-line no-template-curly-in-string
      run: |
        mkdir -p android/capacitor-cordova-android-plugins
        echo "ext {" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo "    minSdkVersion = 22" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo "    targetSdkVersion = 34" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo "    compileSdkVersion = 34" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle
        echo "}" >> android/capacitor-cordova-android-plugins/cordova.variables.gradle

        # Buat folder libs agar jika ada flatDir yang mengarah ke libs, foldernya benar-benar ada
        mkdir -p android/app/libs
        mkdir -p android/libs

        # Hapus semua blok flatDir menggunakan Python secara menyeluruh dari semua file build.gradle
        python3 -c '
        import glob, re
        for path in glob.glob("android/**/build.gradle", recursive=True):
            try:
                with open(path, "r") as f:
                    content = f.read()
                # Hapus blok flatDir {...} sepenuhnya
                cleaned = re.sub(r"flatDir\s*\{[^}]*\}", "", content)
                # Hapus juga baris tunggal flatDir jika ada
                cleaned = re.sub(r".*flatDir.*", "", cleaned)
                with open(path, "w") as f:
                    f.write(cleaned)
            except Exception as e:
                print(f"Error cleaning {path}: {e}")
        '

    - name: Grant execute permission for gradlew
      run: |
        cd android
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 8.13

    - name: Clean and Build Debug APK with Gradle
      run: |
        cd android
        ./gradlew clean assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
