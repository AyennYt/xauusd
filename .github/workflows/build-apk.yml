name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Purge problematic Cordova plugin references completely
      run: |
        # Hapus folder plugin cordova palsu jika ada agar tidak dicari oleh gradle
        rm -rf android/capacitor-cordova-android-plugins

        # Bersihkan baris yang memuat kata kunci plugin tersebut dari file konfigurasi gradle
        python3 -c '
        import glob
        for path in glob.glob("android/**/build.gradle", recursive=True) + glob.glob("android/**/settings.gradle", recursive=True):
            try:
                with open(path, "r") as f:
                    lines = f.readlines()
                with open(path, "w") as f:
                    for line in lines:
                        if "capacitor-cordova-android-plugins" not in line:
                            f.write(line)
            except Exception as e:
                print(f"Skipping {path}: {e}")
        '

    - name: Grant execute permission for gradlew
      run: |
        cd android
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 8.13

    - name: Clean and Build Debug APK with Gradle
      run: |
        cd android
        ./gradlew clean assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
